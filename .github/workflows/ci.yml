name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leak scan (fails on any private detail)
        run: python tools/scan_public.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scanner boundary tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Guided setup workflow
        run: |
          pip install segno==1.6.6
          python tools/run_setup_tests.py
      - name: Web playback, artwork, discovery and tracker policies
        run: node --test web/tests/*.test.js
      - name: Parse web scripts
        run: for file in web/dist/*.js; do node --check "$file"; done
      - name: sports-hub unit tests
        working-directory: sports-hub
        run: PYTHONPATH=app python -m unittest discover -s tests -v
      - name: sports-hub image builds
        working-directory: sports-hub
        run: docker build -f Dockerfile -t orbital-sports-hub ..
